buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "29.0.14206865"
        kotlinVersion = "2.2.0"
        // The Android Gradle Plugin version. Not the Gradle distribution version, which lives in
        // gradle/wrapper/gradle-wrapper.properties and is a different number.
        agpVersion = "9.2.1"
    }
    repositories {
        google()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url "https://jitpack.io" }
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agpVersion"
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    repositories {
        maven { url "https://raw.githubusercontent.com/iadvize/iadvize-android-sdk/master" }
        google()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url "https://jitpack.io" }
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
    }
}

apply plugin: "com.facebook.react.rootproject"
